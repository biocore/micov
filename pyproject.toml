[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "micov"
requires-python = ">=3.11"
# 3.13 is still not claimed. The blocker used to be `pyarrow<16.0.0`, which
# capped at 15.0.2 and publishes no cp313 wheels; pyarrow is gone now, but
# nothing has been run on 3.13, so claiming it would be a guess. Revisit by
# adding 3.13 to the CI matrix first.
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    # not OS Independent any more: micov requires the miint DuckDB community
    # extension, which upstream publishes only for Linux (x86_64, aarch64) and
    # macOS on Apple silicon. Windows and Intel macOS have no build.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

# The old `duckdb<1.3` ceiling existed because jemalloc failed to compile on
# very old linux. It is dropped deliberately: duckdb-miint requires >=1.5.4,
# so the ceiling was unholdable, and those systems need a wheel rather than a
# pin. Keep this floor in step with ci/conda_requirements.txt -- the two files
# previously disagreed, which made the conda and pypi CI paths test different
# duckdb majors.
#
# pyarrow was removed here, not merely unpinned. It was never imported by
# micov; it came in as the polars<->DuckDB handoff, and no such handoff is
# left. Verified by running the full golden suite with pyarrow uninstalled.
#
# miint is deliberately absent, and cannot be added: it is a DuckDB *community
# extension*, not a Python distribution, so there is nothing here to depend on.
# micov requires it all the same -- `micov/_miint.py` installs and loads it,
# and raises if it cannot.
dependencies = [
    "click",
    "scipy",
    "polars-u64-idx<1.23.0",
    "numba",
    "matplotlib>=3.9.0",
    "duckdb>=1.5.4",
]

readme = "README.md"
authors = [
    { name = "Daniel McDonald", email = "damcdonald@ucsd.edu" },
    { name = "Sherlyn Weng", email = "y1weng@ucsd.edu" },
    { name = "Caitlin Guccione", email = "cguccion@ucsd.edu" },
]
license = { file = "LICENSE" }
keywords = ["microbiome", "bioinformatics"]

# pytest was previously listed as a runtime dependency, so every user install
# pulled it in. It is a test dependency only.
[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
micov = "micov.cli:cli"

# an empty section is needed to allow setuptools to pull version information
[tool.setuptools_scm]

[tool.ruff]
fix = true
line-length = 88
# Must track requires-python. When these disagreed (py310 vs >=3.9), ruff
# advised a 3.10-only construct for code that had to run on 3.9.
target-version = "py311"

[tool.check-manifest]
ignore = [
    # created by conda-incubator/setup-miniconda@v3 action
    "ci/setup-miniconda-patched-conda_host_env.yml",
]

[tool.ruff.lint]
# adapted from https://github.com/pola-rs/polars/blob/main/py-polars/pyproject.toml
select = [
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # flake8-docstrings
    "E",      # pycodestyle
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FBT001", # flake8-boolean-trap
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INT",    # flake8-gettext
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "PYI",    # flake8-pyi
    "RUF",    # ruff-specific rules
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle
]
ignore = [
    "ANN",  # annotations are not enforced
    "D203", # puts a space before class docstrings
    "D213", # puts summary on second line
    "D400", # redundant with D415 in place
    "D301", # forces raw string literals
]

[tool.ruff.lint.per-file-ignores]
"micov/tests/*" = ["D", "PT"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools.packages.find]
exclude = ["example*", "ci*"]
