# heavily adapted from scikit-bio's CI
# https://github.com/biocore/scikit-bio/blob/31123c6471dc62f45a55bfdff59c61a4850be367/.github/workflows/ci.yml#L1
name: micov CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  latest_python: "3.12"
  supported_pythons: '["3.11", "3.12"]'
  # Mambaforge was retired by conda-forge; Miniforge3 is the supported
  # variant and already bundles mamba.
  miniforge_version: "latest"
  miniforge_variant: "Miniforge3"

jobs:
  conf:
    # This job is needed to route the global environment variables into
    # a context that's available for matrix (and name, but that's unimportant)
    name: Prepare Test Plan
    runs-on: "ubuntu-latest"
    outputs:
      latest_python: ${{ steps.set-vars.outputs.latest_python }}
      supported_pythons: ${{ steps.set-vars.outputs.supported_pythons }}
    steps:
      - name: Report Plan
        id: set-vars
        run: |
          echo "latest_python=$latest_python" >> $GITHUB_OUTPUT
          echo "supported_pythons=$supported_pythons" >> $GITHUB_OUTPUT
  lint:
    name: Lint code (${{ needs.conf.outputs.latest_python }}, ubuntu-latest)
    needs: conf
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.latest_python }}
          miniforge-version: ${{ env.miniforge_version }}
          miniforge-variant: ${{ env.miniforge_variant }}
          environment-file: ci/conda_host_env.yml
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          pip install -r ci/requirements.lint.txt
          conda list
      - name: Run linter
        shell: bash -l {0}
        run: make lint

  test-all:
    name: Test (${{ matrix.python_version }}, ${{ matrix.os }}, ${{ fromJSON('["pypi", "conda"]')[matrix.use_conda] }})
    needs: ["conf", "lint"]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # micov requires the miint DuckDB community extension, which upstream
        # publishes for linux_amd64, linux_arm64 and osx_arm64 only. macos-13
        # (Intel) and windows-latest have no build, so they were dropped rather
        # than carried as a second, silently-diverging compute path.
        # macos-latest is arm64, so macOS stays covered.
        os: ["ubuntu-latest", "macos-latest"]
        python_version: ${{ fromJSON(needs.conf.outputs.supported_pythons) }}
        use_conda: [true, false]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          # was env.latest_python, which made the whole version matrix
          # decorative -- every cell silently tested only the latest Python
          python-version: ${{ matrix.python_version }}
          miniforge-version: ${{ env.miniforge_version }}
          miniforge-variant: ${{ env.miniforge_variant }}
          environment-file: ci/conda_host_env.yml
      - name: Install dependencies (conda)
        if: ${{ matrix.use_conda }}
        shell: bash -l {0}
        run: |
          conda install -q --yes -c conda-forge --file ci/conda_requirements.txt
          pip install . --no-deps
          conda list
      - name: Install dependencies (pip)
        if: ${{ !matrix.use_conda }}
        shell: bash -l {0}
        run: |
          pip install .[test]
          conda list
      # Done as its own step so a community-repository outage reads as an
      # install failure rather than as a wall of confusing test failures. It
      # also warms ~/.duckdb/extensions once, instead of every test process
      # racing to fetch the same file.
      - name: Install the miint extension
        shell: bash -l {0}
        run: |
          python -c "import duckdb; duckdb.sql('INSTALL miint FROM community')"
      - name: Run unit tests
        shell: bash -l {0}
        run: |
          make test
