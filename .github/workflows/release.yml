# derived from https://github.com/biocore/biom-format/blob/master/.github/workflows/release.yml
name: Build and upload to PyPI

on:
  push:
    tags:
      - "*"

env:
  earliest_python: "3.9"
  latest_python: "3.12"
  miniforge_version: "23.11.0-0"
  miniforge_variant: "Mambaforge"

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/micov
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.latest_python }}
        uses: actions/setup-python@v5
        with:
          # was hardcoded to 3.8, which is EOL and below this project's
          # requires-python floor; latest_python was declared but unused
          python-version: ${{ env.latest_python }}
      - name: Build distribution
        run: |
          # set version from '${{ github.ref_name }}'
          export RELEASE_VERSION=${{ github.ref_name }}
          pip install build
          python -m build -s

      - name: Publish a Python distribution to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        # trusted publishing: authenticated by the `id-token: write`
        # permission and the `pypi` environment above, so no API token
        uses: pypa/gh-action-pypi-publish@release/v1
